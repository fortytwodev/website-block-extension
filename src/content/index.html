<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/src/css/styles.css">
        <title>Block Website</title>
    </head>
    <body>
        <div class="container">
            <header class="header">
                <h1>Block Website</h1>
            </header>

            <section class="input-section">
                <div class="input-wrapper">
                    <span class="input-prefix">https://</span>
                    <input
                        type="text"
                        class="url-input"
                        id="inputUrl"
                        placeholder="example.com"
                    >
                    <button class="add-btn" type="button" id="currentWebsiteAddButton">Add</button>
                </div>
                <div class="duplicate-alert-div">
                    <span class="duplicate-alert-msg">The URL is already on the blocked list.</span>
                </div>
            </section>

            <section class="list-section">
                <h2 class="section-title">Blocked Websites</h2>
                <ul class="blocked-list" id="blockedUrlsList">
                </ul>
            </section>
        </div>
        <script src="/src/scripts/index.js"></script>
    </body>
</html>
